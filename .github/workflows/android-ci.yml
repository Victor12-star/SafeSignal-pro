name: Android CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Gradle project
        run: gradle projects --stacktrace

      - name: Run shared Android unit tests
        run: gradle :shared:testDebugUnitTest --stacktrace

      - name: Run Android app unit tests
        run: gradle :androidApp:testDebugUnitTest --stacktrace

      - name: Compile Android debug build
        run: gradle :androidApp:assembleDebug --stacktrace
