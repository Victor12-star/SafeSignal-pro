name: Android CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Gradle project
        run: gradle projects --stacktrace

      - name: Run shared Android unit tests
        run: gradle :shared:testDebugUnitTest --stacktrace

      - name: Run Android app unit tests
        run: gradle :androidApp:testDebugUnitTest --stacktrace

      - name: Compile Android debug build
        run: gradle :androidApp:assembleDebug --stacktrace


  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safesignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safesignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap Supabase auth stubs
        run: psql -h 127.0.0.1 -U postgres -d safesignal_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql

      - name: Apply backend migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d safesignal_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify RLS and sensitive-token protections
        run: psql -h 127.0.0.1 -U postgres -d safesignal_test -v ON_ERROR_STOP=1 -f supabase/tests/backend_security.sql

      - name: Verify direct SMS queue protections
        run: psql -h 127.0.0.1 -U postgres -d safesignal_test -v ON_ERROR_STOP=1 -f supabase/tests/direct_sms_queue.sql
